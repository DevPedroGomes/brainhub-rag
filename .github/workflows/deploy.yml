name: Build & push image (VPS auto-pulls)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Roda ANTES do build e trava o deploy. A suite prende regressoes (limiar de
  # relevancia contra a escala errada, snippet truncado antes do gerador, uma
  # requisicao de embedding por variante de query). Nao toca a rede: sem chave
  # de API, sem custo, alguns segundos.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres e Redis reais para os testes `integration`: rodam as migrations
    # num banco vazio e exercitam a app sobre ele.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -q -r requirements-dev.lock
      - name: Instalar decodificador de video para os testes de ingestao
        timeout-minutes: 4
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            exit 0
          fi
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$apt_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://x/y
          JWT_SECRET: ci
          VOYAGE_API_KEY: ci
        run: python -m pytest tests/ -q -m "not integration"
      - name: pytest (integracao, Postgres e Redis reais)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://x/y
          JWT_SECRET: ci-segredo-com-32-bytes-ou-mais
          VOYAGE_API_KEY: ci
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -m integration -q

  # Vulnerabilidade conhecida em dependencia de producao trava o deploy. Le o
  # lock, onde toda versao esta pinada. O agent-ops vem do git e o pip-audit nao
  # audita URL, mas as dependencias dele estao no lock e entram na auditoria.
  # Job e venv proprios: instalar o pip-audit junto do pytest mexeria nas versoes
  # que os testes usam.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        working-directory: backend
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install -q pip-audit==2.10.1
          "$RUNNER_TEMP/audit/bin/pip-audit" -r requirements.lock --no-deps --disable-pip --progress-spinner off

  build:
    needs: [test, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Placeholders p/ env_file referenciados (compose parsing; .env real vive na VPS)
        run: |
          python3 - <<'EOF'
          import yaml, pathlib
          d = yaml.safe_load(open("docker-compose.yml")) or {}
          for s in (d.get("services") or {}).values():
              ef = (s or {}).get("env_file")
              if not ef:
                  continue
              for it in (ef if isinstance(ef, list) else [ef]):
                  p = it.get("path") if isinstance(it, dict) else it
                  fp = pathlib.Path(p)
                  fp.parent.mkdir(parents=True, exist_ok=True)
                  fp.touch()
          pathlib.Path(".env").touch()
          EOF
      # `push` sem argumento empurra TODO servico que tem `build:` — e ignora os
      # que nao tem (o `redis`, que vem do Docker Hub). Uma lista na mao que
      # esquecesse um servico com imagem propria o deixaria de fora em silencio,
      # e a VPS puxaria uma `:latest` velha. Sem lista, nao ha o que esquecer de
      # atualizar.
      - name: Build + push (todo servico com `build:`)
        run: |
          docker compose build
          docker compose push
